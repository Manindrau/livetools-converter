name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 130.210.10.48
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: ~/deploy.sh
